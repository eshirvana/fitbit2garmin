[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fitbit2garmin"
version = "2.0.0"
description = "Migrate a Fitbit Google Takeout export to Garmin Connect (activities, weight, and best-effort monitoring data)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "click>=8.1.0",
    "fit-tool>=0.9.0",
    "gpxpy>=1.5.0",
]

[project.scripts]
fitbit2garmin = "fitbit2garmin.cli:main"

[project.urls]
Homepage = "https://github.com/user/fitbit2garmin"
Repository = "https://github.com/user/fitbit2garmin"
Issues = "https://github.com/user/fitbit2garmin/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["fitbit2garmin*"]
exclude = ["output*", "tests*"]